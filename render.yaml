services:
  - type: web
    name: thermos-ai
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FORTYGUARD_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false